name: Feature request
description: Suggest something Longshot should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the feature — it often has a simpler answer than the one you had in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
